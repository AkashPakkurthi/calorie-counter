name: Daily nudge email

on:
  schedule:
    # GitHub cron is UTC and has no DST, which suits IST (fixed +5:30).
    - cron: "30 5 * * *"   # 11:00 IST -- prompt if nothing is logged yet
    # TEMPORARY for testing -- 23:05 IST. Revert to "30 14 * * *" (20:00 IST).
    - cron: "35 17 * * *"  # 23:05 IST -- how the day went
  workflow_dispatch:
    inputs:
      mode:
        description: Which email to send
        type: choice
        options: [morning, evening]
        default: evening

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          # A scheduled run has no inputs, so pick the mode from the cron line
          # that fired; a manual run uses whatever was chosen.
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 5 * * *' && 'morning' || 'evening') }}
        run: |
          # Say which secret is missing, rather than failing with a curl
          # exit code that means nothing to anyone.
          for name in APP_URL CRON_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          done

          echo "sending the $MODE email"
          # A sleeping free-tier container needs a moment to wake, and the
          # database wakes with it -- so allow retries rather than failing.
          # `set +e` keeps a failed curl from aborting the whole loop.
          set +e
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
              --max-time 120 \
              -X POST "$APP_URL/api/notifications/daily?mode=$MODE" \
              -H "X-Cron-Token: $CRON_TOKEN")
            echo "attempt $attempt -> HTTP $code"
            cat /tmp/out.json; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "daily email run failed"
          exit 1
